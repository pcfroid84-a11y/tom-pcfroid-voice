name: Apply one-turn flow-stage safety fix

on:
  push:
    paths:
      - '.github/workflows/fix-stage-per-turn.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch server.js
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server.js')
          s = p.read_text()

          anchor = '''          state.lastCallerMessage = callerMessage;\n\n          if (isClearlyOutOfCompetenceRequest(callerMessage)) {'''
          replacement = '''          state.lastCallerMessage = callerMessage;\n\n          // Un même tour client ne doit normalement faire avancer qu'une seule étape.\n          // On mémorise l'étape au début du traitement pour éviter qu'une réponse\n          // au statut client soit aussi prise pour une identité, ou qu'une adresse\n          // commençant par « oui » valide aussi le numéro de rappel.\n          const flowStageAtTurnStart = state.flowStage;\n\n          if (isClearlyOutOfCompetenceRequest(callerMessage)) {'''
          if anchor not in s:
              raise SystemExit('Anchor for stage snapshot not found')
          s = s.replace(anchor, replacement, 1)

          replacements = [
              ('if (state.flowStage === "customer_status") {', 'if (flowStageAtTurnStart === "customer_status") {'),
              ('if (state.flowStage === "city" || callerCorrectsCity(callerMessage)) {', 'if (flowStageAtTurnStart === "city" || callerCorrectsCity(callerMessage)) {'),
              ('  state.flowStage === "city" &&\n  state.customerStatus === "new" &&', '  flowStageAtTurnStart === "city" &&\n  state.customerStatus === "new" &&'),
              ('if (state.flowStage === "address") {', 'if (flowStageAtTurnStart === "address") {'),
              ('if (state.flowStage === "callback") {', 'if (flowStageAtTurnStart === "callback") {'),
              ('if (state.flowStage === "callback_number") {', 'if (flowStageAtTurnStart === "callback_number") {'),
              ('  state.flowStage === "final_question" &&\n  state.finalQuestionAsked', '  flowStageAtTurnStart === "final_question" &&\n  state.finalQuestionAsked'),
              ('if (state.flowStage === "identity") {\n              detectedName = extractDirectIdentityAnswer(callerMessage);', 'if (flowStageAtTurnStart === "identity") {\n              detectedName = extractDirectIdentityAnswer(callerMessage);'),
              ('state.flowStage === "identity" ? "question-identité" : "volontaire"', 'flowStageAtTurnStart === "identity" ? "question-identité" : "volontaire"'),
              ('} else if (state.flowStage === "identity") {\n              app.log.info(', '} else if (flowStageAtTurnStart === "identity") {\n              app.log.info('),
          ]

          # Restrict replacements to the transcription handler region so flow-lock logic
          # and other functions keep using the live state as intended.
          start = s.index('conversation.item.input_audio_transcription.completed')
          end = s.index('if (event.type === "response.output_audio.delta")', start)
          before, region, after = s[:start], s[start:end], s[end:]
          for old, new in replacements:
              if old not in region:
                  raise SystemExit(f'Expected transcription-handler pattern not found: {old!r}')
              region = region.replace(old, new, 1)
          s = before + region + after

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix multi-stage processing in one caller turn"
          git push
